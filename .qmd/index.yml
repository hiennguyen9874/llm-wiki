global_context: |
  Compiled LLM Wiki concepts. Results are retrieval candidates, not authoritative evidence. Inspect concept metadata, relationships, contradictions, and sources before synthesis.
collections:
  wiki:
    path: ./wiki
    pattern: "**/*.md"
    ignore:
      - index.md
      - "**/index.md"
      - log.md
    includeByDefault: true
    context:
      /: Durable compiled concepts governed by LLM-WIKI.md
models:
  embed: hf:ggml-org/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
