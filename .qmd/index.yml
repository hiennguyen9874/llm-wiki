global_context: >
  Compiled LLM Wiki concepts. Results are retrieval candidates, not authoritative
  evidence. Inspect concept metadata, relationships, contradictions, and sources
  before synthesis.

collections:
  wiki:
    path: ./wiki
    pattern: "**/*.md"
    ignore:
      - "index.md"
      - "**/index.md"
      - "log.md"
    includeByDefault: true
    context:
      "/": "Durable compiled concepts governed by LLM-WIKI.md"
