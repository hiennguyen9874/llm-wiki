<svg xmlns="http://www.w3.org/2000/svg" width="960" height="522" viewBox="0 0 960 522"><title>The code is the graph</title><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#092224" d="m0 0 10 5-10 5z"/></marker></defs><rect width="960" height="522" fill="#fff" rx="16"/><rect width="959" height="521" x=".5" y=".5" fill="none" stroke="#e6eaea" rx="16"/><text x="36" y="44" fill="#092224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">The code is the graph</text><text x="36" y="72" fill="#55726a" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">A program the model can write for the cart task, and the graph it encodes.</text><rect width="500" height="294" x="36" y="104" fill="#092224" rx="12"/><text xml:space="preserve" x="54" y="132" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.4"><tspan fill="#e520e9">import </tspan><tspan fill="#fbffea">asyncio</tspan></text><text xml:space="preserve" x="54" y="176" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.4"><tspan fill="#fbffea">items, offset = [], </tspan><tspan fill="#9b77ff">0</tspan></text><rect width="4" height="20" x="42" y="184" fill="#9b77ff" rx="2"/><text xml:space="preserve" x="54" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.4"><tspan fill="#e520e9">while </tspan><tspan fill="#fbffea">offset </tspan><tspan fill="#e520e9">is not </tspan><tspan fill="#9b77ff">None</tspan><tspan fill="#fbffea">:</tspan></text><rect width="4" height="20" x="42" y="206" fill="#9b77ff" rx="2"/><text xml:space="preserve" x="54" y="220" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.4"><tspan fill="#fbffea">    page = </tspan><tspan fill="#e520e9">await </tspan><tspan fill="#77ffd8">list_items</tspan><tspan fill="#fbffea">(offset=offset, limit=</tspan><tspan fill="#9b77ff">50</tspan><tspan fill="#fbffea">)</tspan></text><rect width="4" height="20" x="42" y="228" fill="#9b77ff" rx="2"/><text xml:space="preserve" x="54" y="242" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.4"><tspan fill="#fbffea">    items += page[</tspan><tspan fill="#ffd4e5">&quot;items&quot;</tspan><tspan fill="#fbffea">]</tspan></text><rect width="4" height="20" x="42" y="250" fill="#9b77ff" rx="2"/><text xml:space="preserve" x="54" y="264" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.4"><tspan fill="#fbffea">    offset = page[</tspan><tspan fill="#ffd4e5">&quot;next_offset&quot;</tspan><tspan fill="#fbffea">]</tspan></text><rect width="4" height="20" x="42" y="294" fill="#ff6550" rx="2"/><text xml:space="preserve" x="54" y="308" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.4"><tspan fill="#fbffea">pricey = [i </tspan><tspan fill="#e520e9">for </tspan><tspan fill="#fbffea">i </tspan><tspan fill="#e520e9">in </tspan><tspan fill="#fbffea">items </tspan><tspan fill="#e520e9">if </tspan><tspan fill="#fbffea">i[</tspan><tspan fill="#ffd4e5">&quot;unit_price&quot;</tspan><tspan fill="#fbffea">] &gt; </tspan><tspan fill="#9b77ff">50</tspan><tspan fill="#fbffea">]</tspan></text><rect width="4" height="20" x="42" y="316" fill="#e520e9" rx="2"/><text xml:space="preserve" x="54" y="330" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.4"><tspan fill="#e520e9">await </tspan><tspan fill="#fbffea">asyncio.gather(*(</tspan><tspan fill="#77ffd8">remove_item</tspan><tspan fill="#fbffea">(item_id=i[</tspan><tspan fill="#ffd4e5">&quot;id&quot;</tspan><tspan fill="#fbffea">])</tspan></text><rect width="4" height="20" x="42" y="338" fill="#e520e9" rx="2"/><text xml:space="preserve" x="54" y="352" font-family="ui-monospace,