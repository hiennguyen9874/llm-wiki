<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Code mode with a Modal sandbox workspace</title><desc id="desc">Your process holds the agent loop, the model API key, Monty, and the tool functions. The agent loop calls run_code, which runs the model's program in Monty. The program makes function calls such as read_file and edit_file, and the agent loop makes direct tool calls such as run_command. Both reach the tool functions in your process, which act through ctx.workspace on the project files, shell, and packages in a Modal sandbox.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#092224"/></marker></defs>
<rect width="800" height="440" fill="#fbffea" rx="24"/>
<rect x="30" y="40" width="470" height="360" rx="14" fill="none" stroke="#092224" stroke-opacity=".35" stroke-width="1.5"/>
<g fill="#fdeafd" stroke="#c71cca" stroke-width="1.5" stroke-dasharray="6 5">
<rect x="50" y="220" width="200" height="160" rx="12"/>
<rect x="600" y="40" width="170" height="360" rx="14"/>
</g>
