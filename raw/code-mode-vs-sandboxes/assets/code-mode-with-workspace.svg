<text x="46" y="64" fill="#5f6d6e">YOUR PROCESS</text>
<text x="66" y="244" fill="#c71cca">MONTY</text>
<text x="616" y="64" fill="#c71cca">SANDBOX: MODAL</text>
</g>
<g fill="#fff" stroke="#092224" stroke-opacity=".35" stroke-width="1.5">
<rect x="50" y="124" width="200" height="36" rx="8"/>
<rect x="66" y="258" width="168" height="34" rx="8"/>
<rect x="330" y="80" width="150" height="300" rx="12"/>
<rect x="615" y="160" width="140" height="34" rx="8"/>
<rect x="615" y="203" width="140" height="34" rx="8"/>
<rect x="615" y="246" width="140" height="34" rx="8"/>
</g>
<rect x="50" y="80" width="200" height="36" rx="8" fill="#ffe8e4" stroke="#ff6550" stroke-width="1.5"/>
<g font-family="ABC Diatype, Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#092224" text-anchor="middle">
<text x="150" y="147">Agent loop</text>
<text x="150" y="103">Model API key</text>
<text x="150" y="280">Model's program</text>
<text x="685" y="225">Shell</text>
<text x="685" y="268">Packages</text>
</g>
<text x="346" y="104" font-family="ABC Diatype, Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#5f6d6e">TOOL FUNCTIONS</text>
<g font-family="FT System Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#092224">
<text x="346" y="140">read_file</text>
<text x="346" y="166">edit_file</text>
<text x="346" y="192">list_directory</text>
<text x="346" y="218">search_files</text>
<text x="346" y="244">...</text>
<text x="346" y="296">run_command</text>
<text x="346" y="322">start_command</text>
<text x="685" y="182" text-anchor="middle">/root/project</text>
<g fill="#5f6d6e" font-size="13"><text x="66" y="320">await read_file(...)</text><text x="66" y="344">await edit_file(...)</text></g>
</g>
