<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Tool calling compared with code mode</title><desc id="desc">With tool calling, the model makes three requests: one to call list_orders, one to call get_order three times, and one to answer, and every result enters its context. With code mode, the model makes two requests: one run_code call whose program calls list_orders, get_order three times, filters, and sums inside Monty, returning one small dict, and one to answer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#092224"/></marker></defs>
<rect width="800" height="440" fill="#fbffea" rx="24"/>
<g font-family="ABC Diatype, Inter, ui-sans-serif, system-ui, sans-serif" fill="#092224">
<text x="40" y="52" font-size="22" font-weight="700">Tool calling</text>
<text x="430" y="52" font-size="22" font-weight="700">Code mode</text>
</g>
<path d="M400 30v380" stroke="#092224" stroke-opacity=".12"/>
<g fill="#fff" stroke="#092224" stroke-opacity=".35" stroke-width="1.5">
<rect x="40" y="90" width="100" height="44" rx="10"/>
<rect x="40" y="190" width="100" height="44" rx="10"/>
<rect x="40" y="290" width="100" height="44" rx="10"/>
<rect x="240" y="90" width="130" height="44" rx="10"/>
<rect x="240" y="190" width="130" height="44" rx="10"/>
<rect x="430" y="90" width="100" height="44" rx="10"/>
<rect x="430" y="290" width="100" height="44" rx="10"/>
</g>
<rect x="620" y="76" width="150" height="160" rx="12" fill="#fdeafd" stroke="#c71cca" stroke-width="1.5" stroke-dasharray="6 5"/>
<g font-family="ABC Diatype, Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#092224" text-anchor="middle">
<text x="90" y="117">Model</text>
<text x="90" y="217">Model</text>
<text x="90" y="317">Model</text>
<text x="480" y="117">Model</text>
<text x="480" y="317">Model</text>
<text x="290" y="317" text-anchor="start">answer</text>
<text x="620" y="317" text-anchor="start">answer</text>
</g>
<g font-family="FT System Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#092224">
<text x="305" y="117" text-anchor="middle">list_orders</text>
<text x="305" y="217" text-anchor="middle">get_order ×3</text>
<text x="575" y="104" text-anchor="middle">run_code</text>
<text x="636" y="134">list_orders()</text>
<text x="636" y="164">get_order() ×3</text>
<text x="636" y="194">filter, sum</text>
</g>
<text x="636" y="100" font-family="ABC Diatype, Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c71cca">MONTY</text>
<g font-family="ABC Diatype, Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5f6d6e" text-anchor="middle">
<text x="190" y="157">3 order IDs</text>
<text x="190" y="257">3 full orders</text>
<text x="575" y="157">1 small dict</text>
</g>
<g stroke="#092224" stroke-width="1.5" marker-end="url(#arrow)">
<path d="M140 104h96"/>
<path d="M240 122h-96"/>
<path d="M140 204h96"/>
<path d="M240 222h-96"/>
<path d="M140 312h140"/>
<path d="M530 112h86"/>
<path d="M620 130h-86"/>
<path d="M530 312h80"/>
</g>
<g font-family="ABC Diatype, Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#092224">
<text x="40" y="384" font-weight="700">3 model requests</text>
<text x="40" y="406" fill="#5f6d6e">Every intermediate result enters the context</text>
<text x="430" y="384" font-weight="700">2 model requests</text>
<text x="430" y="406" fill="#5f6d6e">Only the final result enters the context</text>
</g>
</svg>
