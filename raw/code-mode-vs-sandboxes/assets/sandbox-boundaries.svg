<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Three places to put the sandbox boundary</title><desc id="desc">Three panels. The whole agent, as in cloud coding agents and CI jobs: your process only starts the sandbox, and the agent loop, the model API key, and the tools with files and shell all run inside it, so the model key is in the sandbox. Only the tools, a Pydantic AI workspace: the agent loop, the model API key, and the tools run in your process and act through ctx.workspace on files, shell commands, and packages in the sandbox, so keys stay out and files and commands are isolated. Only the code, code mode with Monty: the agent loop, the model API key, and the tools run in your process, the model's program runs in Monty with no files, network, or environment, and it reaches the tools through function calls, so the program is isolated and the tools keep host access.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#092224"/></marker></defs>
<rect width="800" height="560" fill="#fbffea" rx="24"/>
<g font-family="ABC Diatype, Inter, ui-sans-serif, system-ui, sans-serif" fill="#092224">
<text x="40" y="50" font-size="20" font-weight="700">The whole agent</text>
<text x="300" y="50" font-size="20" font-weight="700">Only the tools</text>
<text x="560" y="50" font-size="20" font-weight="700">Only the code</text>
<g font-size="14" fill="#5f6d6e"><text x="40" y="72">Cloud coding agents, CI</text><text x="300" y="72">Pydantic AI workspace</text><text x="560" y="72">Code mode with Monty</text></g>
</g>
